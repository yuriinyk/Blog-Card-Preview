<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  <title>Blog Card Preview</title>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <span class="publish-date">Published 21 Dec 2023</span>
    </div>

    <div class="card-image">
      <img src="assets/images/blog-card-preview.jpg" alt="Blog Image" />
    </div>
    <div class="card-content">
      <h2>Exploring the Rooftops of Lviv: A Glimpse Into the Heart of the City</h2>
      <p>From the iconic rooftops to the charming streets, Lviv offers a unique view of Ukrainian culture.</p>
    </div>

    <div class="card-footer">
      <div class="author-info">
        <img class="author-img" src="assets/images/author.jpg" alt="Author">
        <span class="author-name">Yurii13</span>
      </div>
    </div>
  </div>

</body>
</html>
